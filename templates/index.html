<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMate | Movie & Entertainment Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #111827, #312e81);
            color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-app {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            min-height: 550px;
            background: rgba(17, 24, 39, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .header {
            padding: 20px 24px;
            background: linear-gradient(90deg, #7c3aed, #db2777);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.18);
            font-size: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.3rem;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 78%;
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .bot {
            align-self: flex-start;
            background: #262f42;
            border-bottom-left-radius: 5px;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            border-bottom-right-radius: 5px;
        }

        .input-area {
            display: flex;
            gap: 12px;
            padding: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: #151b2b;
        }

        #message-input {
            flex: 1;
            border: 1px solid #3b4254;
            outline: none;
            border-radius: 14px;
            padding: 14px 16px;
            background: #222a3b;
            color: white;
            font-size: 1rem;
        }

        #message-input:focus {
            border-color: #a855f7;
        }

        #send-button {
            border: none;
            border-radius: 14px;
            padding: 0 22px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        #send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing {
            opacity: 0.7;
            font-style: italic;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-app {
                height: 100vh;
                min-height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 88%;
            }

            #send-button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>
    <main class="chat-app">
        <header class="header">
            <div class="logo">🎬</div>
            <div>
                <h1>MovieMate</h1>
                <p>Your Movie & Entertainment Assistant</p>
            </div>
        </header>

        <section id="chat-box">
            <div class="message bot">
Hello! I'm MovieMate 🎬

I can help you with movies, TV shows, anime, actors, directors, entertainment discussions and recommendations.

What would you like to know?
            </div>
        </section>

        <form class="input-area" id="chat-form">
            <input
                type="text"
                id="message-input"
                placeholder="Ask about movies and entertainment..."
                autocomplete="off"
                required
            >
            <button type="submit" id="send-button">Send</button>
        </form>
    </main>

    <script>
        const chatForm = document.getElementById("chat-form");
        const messageInput = document.getElementById("message-input");
        const chatBox = document.getElementById("chat-box");
        const sendButton = document.getElementById("send-button");

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = `message ${type}`;
            message.textContent = text;
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
            return message;
        }

        chatForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, "user");
            messageInput.value = "";
            sendButton.disabled = true;
            messageInput.disabled = true;

            const typingMessage = addMessage("MovieMate is thinking...", "bot typing");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                typingMessage.remove();

                if (!response.ok) {
                    throw new Error(data.error || "Something went wrong.");
                }

                addMessage(data.response, "bot");

            } catch (error) {
                typingMessage.remove();
                addMessage(
                    error.message || "Sorry, I couldn't connect to the assistant.",
                    "bot"
                );
            } finally {
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        });
    </script>
</body>
</html>
